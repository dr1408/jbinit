name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Select correct Xcode
        uses: mobiledevops/xcode-select-version-action@v1
        with:
          xcode-select-version: 16.4

      - name: Install dependencies (packages)
        run: |
          brew install make gnu-sed ldid-procursus fakeroot

      - name: Install dependencies
        run: |
          curl -fL https://static.palera.in/artifacts/loader/universal_lite/palera1nLoader.ipa -o palera1nLoader.ipa
          curl -fL https://static.palera.in/binpack.tar -o binpack.tar
          install -m644 binpack.tar palera1nLoader.ipa src

      - name: Compile
        run: |
          gmake -j1 tools
          gmake -j$(sysctl -n hw.ncpu) TARGET_SDK=iphoneos JBINIT_ARCH=arm64e

      - name: Prepare for upload (RELEASE)
        run: |
          mkdir dist
          cp src/ramdisk.dmg dist/ramdisk.dmg
          cp src/binpack.dmg dist/binpack.dmg

      - name: Compile DEVELOPMENT
        run: |
          gmake clean
          gmake -j$(sysctl -n hw.ncpu) TARGET_SDK=iphoneos JBINIT_ARCH=arm64e DEV_BUILD=1


      - name: Prepare for upload (DEVELOPMENT)
        run: |
          cp src/ramdisk.dmg dist/ramdisk.development.dmg
          cp src/binpack.dmg dist/binpack.development.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jbinit-xr-ios-arm64e
          path: dist/*
          if-no-files-found: error
